name: M001 GR001 Native Capture

on:
  push:
    paths:
      - '.github/workflows/mission001-gr001-native-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright-core@1.55.0
      - name: GH8 data-window timestamp verification
        run: |
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright-core');
          (async()=>{const r={mission:'MISSION-001',route:'GH8_DATA_WINDOW_TIMESTAMP_VERIFY',golden_id:'GR-001',requested_display_time:'2026-08-20 01:30',timestamp_utc:new Date().toISOString(),target_time_verified:false,data_window_timestamp_text:null,extracted_ohlc:null,verdict:'UNRESOLVED',error:null}; let browser;
          try{browser=await chromium.launch({channel:'chrome',headless:true}); const c=await browser.newContext({locale:'en-US',viewport:{width:1600,height:1100}}); const p=await c.newPage(); const resp=await p.goto('https://www.tradingview.com/chart/?symbol=OANDA%3AXAUUSD&interval=1',{waitUntil:'domcontentloaded',timeout:60000}); r.page_loaded=!!resp&&resp.status()<500; r.http_status=resp?resp.status():null; await p.waitForTimeout(12000);
          await p.keyboard.press('Alt+g'); await p.waitForTimeout(1500);
          const d=p.locator('input[placeholder="YYYY-MM-DD"]:visible').first(); if(await d.count()){await d.fill('2026-08-20');r.date_value=await d.inputValue();}
          const ins=p.locator('input:visible'); let t=null; for(let i=0;i<await ins.count();i++){const e=ins.nth(i);const v=await e.inputValue().catch(()=> ''); if(/^\d{1,2}:\d{2}$/.test(v)){t=e;break;}} if(t){await t.fill('01:30');r.time_value=await t.inputValue();}
          const btns=p.getByText('Go to',{exact:true}); for(let i=(await btns.count())-1;i>=0;i--){const b=btns.nth(i);if(await b.isVisible().catch(()=>false)){await b.click({force:true,timeout:10000}).catch(()=>{});r.go_to_clicked=true;break;}}
          await p.waitForTimeout(7000);
          const dw=p.locator('[aria-label*="Data Window" i], [aria-label*="Object Tree" i], [title*="Data Window" i], [data-name*="data-window" i]'); r.data_window_candidates=await dw.count(); let opened=false; for(let i=0;i<await dw.count();i++){const e=dw.nth(i); if(await e.isVisible().catch(()=>false)){await e.click({force:true}).catch(()=>{});opened=true;break;}} r.data_window_opened=opened; await p.waitForTimeout(1500);
          const canvases=p.locator('canvas'); const n=await canvases.count(); let box=null; for(let i=0;i<n;i++){const b=await canvases.nth(i).boundingBox().catch(()=>null);if(b&&b.width>600&&b.height>300){box=b;break;}} if(box){await p.mouse.move(box.x+box.width*0.50,box.y+box.height*0.65);await p.waitForTimeout(1200);}
          const body=await p.locator('body').innerText().catch(()=> ''); r.body_excerpt=body.slice(0,18000);
          const pats=[/2026-08-20[^\n]{0,100}01:30/i,/20\/08\/2026[^\n]{0,100}01:30/i,/20\s+Aug(?:ust)?\s+2026[^\n]{0,100}01:30/i,/Aug(?:ust)?\s+20[^\n]{0,50}2026[^\n]{0,100}01:30/i,/20\s+Aug[^\n]{0,100}1:30/i]; for(const re of pats){const mm=body.match(re);if(mm){r.data_window_timestamp_text=mm[0];r.target_time_verified=true;break;}}
          const m=body.match(/(?:^|\n)O\s*\n?\s*([\d,.]+)\s*\nH\s*\n?\s*([\d,.]+)\s*\nL\s*\n?\s*([\d,.]+)\s*\nC\s*\n?\s*([\d,.]+)/m); if(m)r.extracted_ohlc={open:m[1],high:m[2],low:m[3],close:m[4]};
          fs.mkdirSync('mission001',{recursive:true}); await p.screenshot({path:'mission001/gr001-native-capture.png'}); r.verdict=r.target_time_verified&&r.extracted_ohlc?'TARGET_DISPLAY_TIMESTAMP_VERIFIED_OHLC':(r.extracted_ohlc?'DATA_WINDOW_TIMESTAMP_UNVERIFIED_OHLC_PRESENT':'ROUTE_FAIL');}
          catch(e){r.error=String(e);r.verdict='ROUTE_FAIL';} finally{if(browser)await browser.close();fs.mkdirSync('mission001',{recursive:true});fs.writeFileSync('mission001/gr001_native_capture.json',JSON.stringify(r,null,2)+'\n');console.log(JSON.stringify(r));}})();
          NODE
      - name: Persist evidence
        if: always()
        run: |
          cp mission001/gr001_native_capture.json /tmp/gr001_native_capture.json
          git config user.name 'mission001-bot'
          git config user.email 'mission001-bot@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p mission001
          cp /tmp/gr001_native_capture.json mission001/gr001_native_capture.json
          git add mission001/gr001_native_capture.json
          git commit -m 'MISSION001: persist GH8 GR-001 evidence' || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission001-gr001-native-capture-gh8
          path: |
            mission001/gr001_native_capture.json
            mission001/gr001-native-capture.png
          if-no-files-found: warn
