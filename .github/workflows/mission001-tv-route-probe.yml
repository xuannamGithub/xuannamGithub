name: M001 A2 Exact P0 Native Compile

on:
  push:
    paths:
      - '.github/workflows/mission001-tv-route-probe.yml'
      - 'mission001/a2-ingress/a2_native_compile.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a2-native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout A2 ingress package
        uses: actions/checkout@v4

      - name: Materialize exact P0 and enforce SHA gate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='9b8eca4c8cf2e151083020f4b3c2812b0ba3f04502c33fb6af892f0371712137'
          mkdir -p mission001/a2-evidence /tmp/mission001-a2
          cat mission001/a2-ingress/p0.xz.b64.part1 \
              mission001/a2-ingress/p0.xz.b64.part2 \
              mission001/a2-ingress/p0.xz.b64.part3 > /tmp/mission001-a2/p0.xz.b64
          base64 -d /tmp/mission001-a2/p0.xz.b64 > /tmp/mission001-a2/p0.xz
          xz -dc /tmp/mission001-a2/p0.xz > /tmp/mission001-a2/MISSION001_TrackA_BotV1_FullDerivative_v0.3.pine
          ACTUAL="$(sha256sum /tmp/mission001-a2/MISSION001_TrackA_BotV1_FullDerivative_v0.3.pine | awk '{print $1}')"
          SIZE="$(wc -c < /tmp/mission001-a2/MISSION001_TrackA_BotV1_FullDerivative_v0.3.pine)"
          VERDICT='PASS'
          if [ "$ACTUAL" != "$EXPECTED" ]; then VERDICT='ABORT_HASH_MISMATCH'; fi
          printf '{"expected_sha256":"%s","actual_sha256":"%s","size_bytes":%s,"verdict":"%s"}\n' \
            "$EXPECTED" "$ACTUAL" "$SIZE" "$VERDICT" > mission001/a2-evidence/a2_materialization_hash.json
          cat mission001/a2-evidence/a2_materialization_hash.json
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'A2 ABORT: SHA mismatch. No browser injection and no compile.' >&2
            exit 42
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright core
        run: npm install playwright-core@1.55.0

      - name: Inject exact P0 and execute native TradingView compile
        run: node mission001/a2-ingress/a2_native_compile.js

      - name: Upload immutable A2 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission001-a2-native-compile-evidence
          path: mission001/a2-evidence/
          if-no-files-found: warn

      - name: Persist A2 evidence only
        if: always()
        shell: bash
        run: |
          git config user.name 'mission001-bot'
          git config user.email 'mission001-bot@users.noreply.github.com'
          git add mission001/a2-evidence
          git commit -m 'MISSION001 A2: preserve native compile evidence' || exit 0
          git push
